[project]
name = "quickpomdps"
version = "0.1.2"
description = "Describing and Solving POMDPs in Python"
authors = [
    { name = "rejuvyesh", email = "mail@rejuvyesh.com" },
    { name = "Zachary Sunberg", email = "sunbergzach@gmail.com" },
    { name = "Lasse Peters", email = "lasse.peters@mailbox.org" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "julia>=0.5,<0.7",
]

[project.urls]
Repository = "https://github.com/Terra-AI-Inc/quickpomdps/"

[dependency-groups]
dev = [
    "pytest>=6.2.5",
    "pytest-cov>=2.12.1",
]

[tool.pytest.ini_options]
addopts = "--cov=quickpomdps"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
